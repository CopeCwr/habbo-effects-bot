name: Habbo effects check

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub puede retrasarlo varios minutos
  workflow_dispatch:         # botón "Run workflow" para ejecutarlo a mano
    inputs:
      enviar_prueba:
        description: "Enviar un efecto de PRUEBA a Discord (no consulta Habbo)"
        type: boolean
        default: false
      efecto_prueba:
        description: "Efecto de ejemplo para la prueba"
        type: choice
        options:
          - Mystic
          - LeavesBlown
          - Spin
        default: Mystic

concurrency:
  group: habbo-effects
  cancel-in-progress: false

permissions:
  contents: write            # necesario para guardar state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Enviar efecto de PRUEBA a Discord
        if: ${{ inputs.enviar_prueba }}
        run: python monitor.py --test-swf "pruebas/${EFECTO}.swf"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EFECTO: ${{ inputs.efecto_prueba }}

      - name: Buscar efectos nuevos
        if: ${{ !inputs.enviar_prueba }}
        run: python monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Guardar estado
        if: ${{ always() && !inputs.enviar_prueba }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json downloads 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar estado"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
